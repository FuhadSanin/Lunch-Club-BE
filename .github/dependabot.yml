# Keeps dependencies current without anyone having to remember: one grouped pull request a
# month per ecosystem, which CI (lint, types, security audit, tests) checks before merging.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: monthly }
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
